[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-codex-labs"
version = "1.0.0"
description = "Small, explicit teaching experiments alongside the real Codex CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-lab = "codex_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
